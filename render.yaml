services:
  # 1. Backend Web Service (Node.js & Express)
  - type: web
    name: booknique-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: booknique-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://booknique-web.onrender.com
      - key: CORS_ORIGINS
        value: https://booknique-web.onrender.com,capacitor://localhost,http://localhost

  # 2. Frontend Web Application (React Vite Static Site)
  - type: web
    name: booknique-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://booknique-api.onrender.com

databases:
  # 3. Managed PostgreSQL Production Cloud Database
  - name: booknique-db
    databaseName: booknique_rental_db
    user: booknique_user
    plan: free
    region: singapore
